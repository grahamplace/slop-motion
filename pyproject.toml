[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stop-motion"
version = "0.1.0"
description = "Local image and timeline tools for an agent making stop-motion videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=2.0,<3", "Pillow>=11,<13"]

[project.scripts]
stop-motion = "stop_motion.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
